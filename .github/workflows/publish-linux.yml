name: publish-linux

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  release:
    types: [ created ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - name: Set up conda build environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: raxport-sysroot217
          create-args: >-
            sysroot_linux-64=2.17
            gcc_linux-64
            gxx_linux-64
            binutils_linux-64
            patchelf
            dotnet-sdk=8
            cmake=3.31
            ninja
            pkg-config
            make
            autoconf
            automake
            libtool
            git
            curl
            zip
            unzip
            tar
            python=3.12
            h5py
          cache-environment: true
          cache-downloads: true

      - name: Prepare vcpkg checkout and cache key
        run: |
          test "$(micromamba list | awk '$1 == "sysroot_linux-64" { print $2 }')" = 2.17
          test -n "${CC:-}"
          test -n "${CXX:-}"
          test -n "${CONDA_BUILD_SYSROOT:-}"

          rm -rf bin release
          git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
          vcpkg_commit="$(git -C vcpkg rev-parse HEAD)"
          toolchain_hash="$(micromamba list --explicit | sha256sum | cut -d' ' -f1)"
          echo "VCPKG_CACHE_KEY=vcpkg-linux-glibc217-${toolchain_hash}-${vcpkg_commit}" >> "$GITHUB_ENV"
          echo "VCPKG_CACHE_PREFIX=vcpkg-linux-glibc217-${toolchain_hash}-" >> "$GITHUB_ENV"

      - name: Restore installed native libraries
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/installed
            vcpkg/downloads
          key: ${{ env.VCPKG_CACHE_KEY }}
          restore-keys: |
            ${{ env.VCPKG_CACHE_PREFIX }}

      - name: Build, verify, and test
        env:
          RAXPORT_BUILD_IN_ENV: 1
        run: ./test/build-linux.sh

      - name: Stage artifact
        run: |
          mkdir -p release
          cp bin/Raxport-linux-x64 release/Raxport-linux-x64
          chmod +x release/Raxport-linux-x64

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Raxport-linux-x64
          path: release/Raxport-linux-x64
          if-no-files-found: error

      - name: Upload binaries to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
