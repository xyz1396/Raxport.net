name: publish-linux

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  release:
    types: [ created ]
  workflow_dispatch:

permissions:
  contents: write

env:
  CONDA_OVERRIDE_GLIBC: '2.17'

jobs:
  publish:
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - name: Set up conda build environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: raxport
          create-args: >-
            sysroot_linux-64=2.17 gcc_linux-64 binutils_linux-64 patchelf
            dotnet-sdk=8 python=3.12 h5py hdf5=*=nompi_* libsqlite zlib libaec
          cache-environment: true
          cache-downloads: true

      - name: Build, verify, and test
        run: ./make.sh

      - name: Stage artifact
        run: |
          mkdir -p release
          cp bin/Raxport-linux-x64 release/Raxport-linux-x64
          chmod +x release/Raxport-linux-x64

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Raxport-linux-x64
          path: release/Raxport-linux-x64
          if-no-files-found: error

      - name: Upload binaries to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
