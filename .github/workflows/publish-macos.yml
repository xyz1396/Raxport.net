name: publish-macos

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  release:
    types: [ created ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: Raxport-osx-x64
            runner: macos-15-intel
          - artifact: Raxport-osx-arm64
            runner: macos-15

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up micromamba build environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: raxport
          create-args: >-
            dotnet-sdk=8 python=3.12 h5py hdf5=*=nompi_* libsqlite zlib libaec
          cache-environment: true
          cache-downloads: true

      - name: Build, verify, and test
        shell: bash -el {0}
        run: ./make.sh

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p release
          cp bin/${{ matrix.artifact }} release/${{ matrix.artifact }}
          chmod +x release/${{ matrix.artifact }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.artifact }}
          if-no-files-found: error

      - name: Upload binaries to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
