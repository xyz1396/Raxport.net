name: publish-windows

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  release:
    types: [ created ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up micromamba build environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: raxport
          create-args: >-
            dotnet-sdk=8 python=3.12 h5py hdf5=*=nompi_* libsqlite zlib libaec pefile
          cache-environment: true
          cache-downloads: true

      - name: Setup MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build, verify, and test
        shell: pwsh
        run: .\make.ps1

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item bin/Raxport-win-x64.exe release/Raxport-win-x64.exe

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Raxport-win-x64
          path: release/Raxport-win-x64.exe
          if-no-files-found: error

      - name: Upload binaries to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
